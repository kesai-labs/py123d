parser:
  _target_: py123d.parser.nureasoning.nureasoning_parser.NureasoningParser
  _convert_: 'all'

  splits: ["nureasoning_train", "nureasoning_val", "nureasoning_test"]
  nureasoning_data_root: ${dataset_paths.nureasoning_data_root}
  log_names: null # clip names <log>_<token> to convert, null = all clips of the splits

log_writer_config:
  _target_: py123d.api.scene.arrow.utils.log_writer_config.LogWriterConfig
  _convert_: 'all'

  force_log_conversion: ${force_log_conversion}
  force_map_conversion: ${force_map_conversion}
  async_conversion: ${async_conversion}

  # NOTE: "path" stores relative image paths; they resolve against the nuReasoning sensor root at read time.
  camera_store_option: "path" # "path", "jpeg_binary", "png_binary"
  # NOTE: "path" stores the relative .pcd path; decoded at read time by nureasoning_sensor_io.
  lidar_store_option: "path" #  "path", "binary"
  lidar_codec: null # None or "laz", "draco", "ipc_zstd", "ipc_lz4", "ipc"

  infer_ego_dynamics: false
  infer_box_dynamics: false

log_writer:
  _target_: py123d.api.scene.arrow.arrow_log_writer.ArrowLogWriter
  _convert_: 'all'
  log_writer_config: ${dataset.log_writer_config}
  logs_root: ${dataset_paths.py123d_logs_root}
  sensors_root: ${dataset_paths.py123d_sensors_root}
  ipc_compression: null
  ipc_compression_level: null

  sync_config:
    _target_: py123d.api.scene.arrow.arrow_log_writer.SyncConfig
    _convert_: 'all'

    # The ego state is the only modality present on every frame of every split: the test split has no
    # box detections, and lidar is absent in many clips.
    reference_column: ego_state_se3.timestamp_us
    direction: "forward" # "forward" or "backward"
    # nuReasoning frames are already at 10Hz.
    target_iteration_duration_s: 0.1

# nuReasoning maps are per-log: NureasoningParser.get_map_parsers() yields one NureasoningMapParser per
# clip, and this writer stores each clip's map at {logs_root}/{split}/{log_name}/map.arrow. Clips of the
# test split have no map.
map_writer:
  _target_: py123d.api.map.arrow.arrow_map_writer.ArrowMapWriter
  _convert_: 'all'
  force_map_conversion: ${force_map_conversion}
  maps_root: ${dataset_paths.py123d_maps_root}
  logs_root: ${dataset_paths.py123d_logs_root}
