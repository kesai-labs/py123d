parser:
  _target_: py123d.parser.opendrive.opendrive_parser.OpenDriveParser
  _convert_: 'all'

  xodr_paths:
    - "Town01.xodr.gz"
    - "Town02.xodr.gz"
    - "Town03.xodr.gz"
    - "Town04.xodr.gz"
    - "Town05.xodr.gz"
    - "Town06.xodr.gz"
    - "Town07.xodr.gz"
    - "Town10HD.xodr.gz"
    - "Town11.xodr.gz"
    - "Town12.xodr.gz"
    - "Town13.xodr.gz"
    - "Town15.xodr.gz"

  location: null
  interpolation_step_size: 1.0
  connection_distance_threshold: 0.1
  internal_only: true

  # None lanes on non-junction roads at least this wide are median strips (not drivable);
  # junction-interior none-lane surfaces stay drivable (crossing pavement). Currently disabled.
  non_drivable_none_lane_min_width: null

  # Shoulder/none-lane/generic-drivable surfaces containing these (x, y) points are carved out of
  # the drivable envelope: areas the source .xodr types as lanes but that are not drivable in reality.
  road_edge_non_drivable_points:
    Town03:
      - [239.3, 41.5]   # tunnel divider barrier, typed as a 3.5 m bidirectional lane on road 65
      - [216.4, -47.0]  # none-lane 83: curved 1.8 m strip forming a drivable ring in the kerb area at the corner
      - [218.7, -50.4]  # none-lane 84: its 1 m inner twin
    Town04:
      - [381.0, 67.0]   # exit gore between the connectors of junction 745: water drums + light pole
      - [382.0, 170.5]  # exit gore between connectors: water drums + light pole
      - [205.8, 364.4]  # exit gore: water drums + light pole
      - [203.7, 364.6]  # same exit gore, second none lane
    Town06:
      - [-1.4, 28.2]    # traffic island on none-lane surface

  # (x, y) polygons carved out of the drivable envelope, for static props standing on otherwise
  # drivable surfaces. Unused: footprint holes on shoulders were judged worse than the props.
  road_edge_non_drivable_polygons: {}

  # Road-edge holes to fill per town: (x, y) points inside areas that are drivable
  # in reality but lack surface coverage in the source .xodr (upstream CARLA map bugs).
  road_edge_fill_hole_points:
    Town03:
      - [78.4, 7.5]     # road area missing from xodr (upstream bug)
    Town06:
      - [9.4, 22.7]     # road area missing from xodr (upstream bug)
      - [10.2, 5.1]     # road area missing from xodr (upstream bug)
    Town07:
      - [-64.3, 100.8]  # plaza west pocket
      - [-27.6, 100.7]  # plaza east pocket
      - [-141.7, 99.0]  # roundabout east splitter island
      - [-149.5, 88.7]  # roundabout south splitter island
    Town10HD:
      - [-46.6, -124.0] # T-junction gore between the turning connectors of junction 468: paved, no lane in the xodr
      - [-35.5, -67.6]  # T-junction gore between the turning connectors of junction 895: paved, no lane in the xodr
      - [41.9, -34.2]   # gore between the turning connectors at the junction mouth near (41.7,-34.2): paved, no lane in the xodr

log_writer_config:
  _target_: py123d.api.scene.arrow.utils.log_writer_config.LogWriterConfig
  _convert_: 'all'

  force_log_conversion: false
  force_map_conversion: ${force_map_conversion}

  infer_ego_dynamics: true
  infer_box_dynamics: true

log_writer:
  _target_: py123d.api.scene.arrow.arrow_log_writer.ArrowLogWriter
  _convert_: 'all'
  log_writer_config: ${dataset.log_writer_config}
  logs_root: ${dataset_paths.py123d_logs_root}
  sensors_root: ${dataset_paths.py123d_sensors_root}
  ipc_compression: null
  ipc_compression_level: null

map_writer:
  _target_: py123d.api.map.arrow.arrow_map_writer.ArrowMapWriter
  _convert_: 'all'
  force_map_conversion: ${force_map_conversion}
  maps_root: ${dataset_paths.py123d_maps_root}
  logs_root: ${dataset_paths.py123d_logs_root}
